<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원자력 해외동향</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#132026; --muted:#5b6b72; --line:#dde3e6;
  --accent:#0a7ea8; --accent-soft:#e2f1f7;
  --large:#2f5d8a; --smr:#0f8a7a; --policy:#8a5a1f; --fuel:#6b4f9a;
  --up:#1f7a4d; --steady:#5b6b72; --caution:#b0701a; --down:#b23b3b;
  --star:#c98a12;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1417; --surface:#152025; --ink:#e4ecef; --muted:#93a4ab; --line:#26343a;
    --accent:#4cc3ec; --accent-soft:#12303b;
    --large:#7fb0e0; --smr:#4fd1bd; --policy:#e0b070; --fuel:#b9a1e6;
    --up:#5fd39a; --steady:#93a4ab; --caution:#e8b25a; --down:#f07f7f; --star:#f0c24a;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1417; --surface:#152025; --ink:#e4ecef; --muted:#93a4ab; --line:#26343a;
  --accent:#4cc3ec; --accent-soft:#12303b;
  --large:#7fb0e0; --smr:#4fd1bd; --policy:#e0b070; --fuel:#b9a1e6;
  --up:#5fd39a; --steady:#93a4ab; --caution:#e8b25a; --down:#f07f7f; --star:#f0c24a;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
a{color:var(--accent)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand small{display:block;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.brand h1{margin:0;font-size:24px;line-height:1.2;font-weight:700;text-wrap:balance}
.datebar{display:flex;align-items:center;gap:6px}
.datebar button,.datebar select{font:500 14px var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;height:36px;padding:0 10px;cursor:pointer}
.datebar button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{font:500 12px var(--mono);color:var(--muted);margin:0 0 10px}
.overview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.overview p{margin:0;max-width:68ch}
.overview .sales{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-weight:500}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px;font-weight:700}
.pulse{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.pc{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.pc[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pc .row{display:flex;align-items:center;gap:8px;font-weight:700}
.pc .sig{font-size:13px;color:var(--muted);line-height:1.5}
.stance{font:500 11px var(--mono);padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.st-expanding{color:var(--up)} .st-steady{color:var(--steady)} .st-cautious{color:var(--caution)} .st-retreating{color:var(--down)}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:500 13px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters input{flex:1 1 160px;min-width:0;font:14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 10px}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
article.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-left:4px solid var(--c)}
.item .tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:500 12px var(--mono);color:var(--muted)}
.item .cat{color:var(--c)}
.item .stars{color:var(--star);letter-spacing:1px}
.item h3{margin:6px 0 2px;font-size:16.5px;line-height:1.4;text-wrap:balance}
.item h3 a{color:var(--ink);text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item .orig{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.item .sum{margin:0;max-width:68ch}
.item .note{margin:10px 0 0;padding:8px 10px;background:var(--accent-soft);border-radius:8px;font-size:14px}
.item .note b{color:var(--accent);font-weight:700;margin-right:4px}
.item .rel{margin:8px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.cat-large{--c:var(--large)} .cat-smr{--c:var(--smr)} .cat-policy{--c:var(--policy)} .cat-fuel{--c:var(--fuel)}
.empty,.err{color:var(--muted);padding:24px 0;text-align:center}
footer{margin-top:36px;font-size:12px;color:var(--muted)}
@media (max-width:520px){.brand h1{font-size:21px}.item h3{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>Overseas Nuclear Brief</small><h1>원자력 해외동향</h1></div>
    <div class="datebar">
      <button id="prev" aria-label="이전 날짜">‹</button>
      <select id="date" aria-label="날짜 선택"></select>
      <button id="next" aria-label="다음 날짜">›</button>
    </div>
  </header>

  <main id="main"><p class="empty">불러오는 중…</p></main>
  <footer>매일 AI 에이전트가 수집·요약합니다. 요약과 시사점은 참고용이며, 원문 링크로 확인하세요.</footer>
</div>

<script>
const CAT = {large:"대형원전", smr:"SMR", policy:"정책·정세", fuel:"연료·공급망"};
const STANCE = {expanding:"확대", steady:"유지", cautious:"신중", retreating:"축소"};
const state = {days:[], date:null, data:null, cat:"all", country:null, minImp:1, q:""};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function getJSON(p){ const r = await fetch(p, {cache:"no-cache"}); if(!r.ok) throw new Error(p+" "+r.status); return r.json(); }

async function boot(){
  try{
    const idx = await getJSON("data/index.json");
    state.days = idx.days.map(d => d.date).sort().reverse();
  }catch(e){
    $("#main").innerHTML = '<p class="err">데이터 목록을 읽지 못했습니다. GitHub Pages 주소로 열었는지 확인하세요.</p>';
    return;
  }
  $("#date").innerHTML = state.days.map(d => `<option value="${d}">${d}</option>`).join("");
  const want = new URLSearchParams(location.search).get("d");
  await load(state.days.includes(want) ? want : state.days[0]);
}

async function load(date){
  state.date = date; state.country = null;
  $("#date").value = date;
  const i = state.days.indexOf(date);
  $("#prev").disabled = i >= state.days.length - 1;
  $("#next").disabled = i <= 0;
  try{ history.replaceState(null, "", "?d=" + date); }catch(e){}
  try{ state.data = await getJSON(`data/${date}.json`); }
  catch(e){ $("#main").innerHTML = `<p class="err">${esc(date)} 브리핑을 읽지 못했습니다.</p>`; return; }
  renderShell(); renderList();
}

function renderShell(){
  const d = state.data;
  const overview = d.overview_ko.split("영업 관점:");
  const pulse = d.countries_pulse.map(p => `
    <button class="pc" data-c="${esc(p.country)}" aria-pressed="false">
      <span class="row">${esc(p.name_ko)} <span class="stance st-${esc(p.stance)}">${STANCE[p.stance]||esc(p.stance)}</span></span>
      <span class="sig">${esc(p.signal)}</span>
    </button>`).join("");
  $("#main").innerHTML = `
    <p class="meta">수집 ${esc(d.period.from)} ~ ${esc(d.period.to)} · 기사 ${d.articles.length}건</p>
    <section class="overview"><p>${esc(overview[0].trim())}</p>${overview[1] ? `<p class="sales">영업 관점: ${esc(overview[1].trim())}</p>` : ""}</section>
    <h2>국가별 정세 <span style="text-transform:none;letter-spacing:0;font-weight:400">— 누르면 해당 기사만</span></h2>
    <div class="pulse">${pulse}</div>
    <h2>기사</h2>
    <div class="filters">
      <div class="seg" id="cats">${[["all","전체"],...Object.entries(CAT)].map(([k,v]) => `<button data-k="${k}" aria-pressed="${state.cat===k}">${v}</button>`).join("")}</div>
      <label><input type="checkbox" id="imp" ${state.minImp>1?"checked":""}> 중요 기사만</label>
      <input id="q" type="search" placeholder="검색 (국가·기업·노형)" value="${esc(state.q)}">
    </div>
    <div class="list" id="list"></div>`;
  document.querySelectorAll(".pc").forEach(b => b.onclick = () => {
    state.country = state.country === b.dataset.c ? null : b.dataset.c;
    document.querySelectorAll(".pc").forEach(x => x.setAttribute("aria-pressed", x.dataset.c === state.country));
    renderList();
  });
  document.querySelectorAll("#cats button").forEach(b => b.onclick = () => {
    state.cat = b.dataset.k;
    document.querySelectorAll("#cats button").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderList();
  });
  $("#imp").onchange = e => { state.minImp = e.target.checked ? 2 : 1; renderList(); };
  $("#q").oninput = e => { state.q = e.target.value; renderList(); };
}

function renderList(){
  const d = state.data, q = state.q.trim().toLowerCase();
  const pulseIds = state.country ? new Set((d.countries_pulse.find(p => p.country === state.country)||{}).article_ids||[]) : null;
  const items = d.articles.filter(a =>
    (state.cat === "all" || a.category === state.cat) &&
    a.importance >= state.minImp &&
    (!pulseIds || pulseIds.has(a.id) || a.countries.includes(state.country)) &&
    (!q || [a.title,a.title_ko,a.summary_ko,a.sales_note,a.source,a.countries.join(" ")].join(" ").toLowerCase().includes(q))
  );
  $("#list").innerHTML = items.length ? items.map(a => `
    <article class="item cat-${esc(a.category)}">
      <div class="tags"><span class="cat">${CAT[a.category]||esc(a.category)}</span><span class="stars" aria-label="중요도 ${a.importance}">${"★".repeat(a.importance)}</span><span>${esc(a.countries.join(" · "))}</span><span>${esc(a.source)} · ${esc(a.published)}</span></div>
      <h3><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title_ko)}</a></h3>
      <p class="orig">${esc(a.title)}</p>
      <p class="sum">${esc(a.summary_ko)}</p>
      ${a.sales_note ? `<p class="note"><b>영업 시사점</b>${esc(a.sales_note)}</p>` : ""}
      ${a.related && a.related.length ? `<p class="rel">관련: ${a.related.map((u,i) => `<a href="${esc(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(" · ")}</p>` : ""}
    </article>`).join("") : '<p class="empty">조건에 맞는 기사가 없습니다.</p>';
}

$("#date").onchange = e => load(e.target.value);
$("#prev").onclick = () => load(state.days[state.days.indexOf(state.date) + 1]);
$("#next").onclick = () => load(state.days[state.days.indexOf(state.date) - 1]);
boot();
</script>
</body>
</html>
