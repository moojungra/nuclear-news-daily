# 해외영업팀 관심 분야 설정 — 코드 몰라도 이 파일만 고치면 에이전트 동작이 바뀝니다.

categories:
  large:  "대형원전 (APR1400/APR1000, AP1000, EPR, VVER, Hualong One 등 신규 건설·수주·계속운전)"
  smr:    "SMR·마이크로·선진로 (i-SMR, NuScale, BWRX-300, Rolls-Royce SMR, Xe-100, Natrium 등)"
  policy: "국가 원자력 정책·규제·정세·국제기구 (IAEA, NEA, EU, 정권 교체, 탈원전/복원전)"
  fuel:   "우라늄·농축·HALEU·핵연료 공급망"

