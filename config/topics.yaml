# 공통 검색 쿼리 ({date}는 기준 월/일로 바뀜)
search_queries:
  - "nuclear power plant news {date}"
  - "new nuclear reactor tender OR contract OR vendor selection {date}"
  - "small modular reactor SMR agreement OR license {date}"
  - "nuclear energy policy government {date}"
  - "uranium enrichment HALEU supply {date}"
  - "KHNP OR KEPCO nuclear export {date}"
  - "Westinghouse OR EDF OR Rosatom nuclear deal {date}"
  - "{country} nuclear power {date}"   # watch_countries 각각에 적용

